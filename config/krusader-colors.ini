# Append to ~/.config/krusaderrc while Krusader is closed (it rewrites the file on exit).
# With "KDE Default" colours Krusader marks the current file only with a dotted focus frame.
[Colors]
KDE Default=false
Enable Alternate Background=false
Show Current Item Always=true
Dim Inactive Colors=false
Foreground=0,0,0
Directory Foreground=0,0,0
Executable Foreground=0,0,0
Symlink Foreground=0,0,0
Invalid Symlink Foreground=0,0,0
Background=255,255,255
Alternate Background=255,255,255
Marked Foreground=0,0,0
Marked Background=208,208,208
Alternate Marked Background=208,208,208
Current Foreground=255,255,255
Current Background=0,0,0
Marked Current Foreground=208,208,208
Inactive Current Foreground=0,0,0
Inactive Current Background=168,168,168
