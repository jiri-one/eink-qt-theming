<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- GNOME's font-antialiasing='none' never reaches Qt on Wayland; mirror it per program. -->
  <match target="pattern">
    <test name="prgname" compare="eq"><string>krusader</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="pattern">
    <test name="prgname" compare="eq"><string>kasts</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
